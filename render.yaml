services:
  - type: web
    name: infosbrain
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@infosbrain.com
      - key: ADMIN_PASSWORD
        value: Admin@123456
      - key: PORT
        value: 10000
