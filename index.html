    <script type="text/javascript">
      // Single Page Apps for GitHub Pages URL restorer
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <script>
      (function () {
        try {
          if (typeof Window !== 'undefined' && Window.prototype) {
            var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (protoDesc && protoDesc.get && !protoDesc.set) {
              var origGet = protoDesc.get;
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function () {
                  return this.__customFetch || origGet.call(this);
                },
                set: function (val) {
                  this.__customFetch = val;
                },
                configurable: true,
                enumerable: protoDesc.enumerable !== false,
              });
            }
          }

          var nativeFetch = typeof window !== 'undefined' ? window.fetch : null;
          var boundFetch = typeof nativeFetch === 'function' ? nativeFetch.bind(window) : nativeFetch;
          var currentFetch = boundFetch;

          if (typeof window !== 'undefined') {
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return currentFetch;
              },
              set: function (newFetch) {
                currentFetch = newFetch;
              },
              configurable: true,
              enumerable: true,
            });
          }

          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            Object.defineProperty(globalThis, 'fetch', {
              get: function () {
                return currentFetch;
              },
              set: function (newFetch) {
                currentFetch = newFetch;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (_) {}
      })();
    </script>
